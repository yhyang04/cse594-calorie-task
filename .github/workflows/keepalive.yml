name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping study backend
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 60 https://okfbtijobhdqrqtfbofn.supabase.co/functions/v1/study/health && exit 0
            sleep 20
          done
          exit 1
